<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hash</title>
  <style>
    body { font: 18px/1.5 system-ui, sans-serif; max-width: 38rem; margin: 12vh auto; padding: 0 1.5rem; color: #17232b; }
    h1 { font-size: 2.5rem; }
    a { color: #176e53; }
  </style>
  <script src="./lz-string.min.js"></script>
</head>
<body>
  <h1>hash has moved to the CLI.</h1>
  <p>For new short links, install <a href="https://www.npmjs.com/package/@theshantanujoshi/hash">@theshantanujoshi/hash</a> and run <code>hash-links serve</code>. Previously created fragment links still redirect here.</p>
  <p id="error" role="status"></p>
  <script>
    if (location.hash.length > 1) {
      const decoded = LZString.decompressFromEncodedURIComponent(location.hash.slice(1));
      try {
        const target = new URL(decoded);
        if (['http:', 'https:'].includes(target.protocol) && !target.username && !target.password) {
          location.replace(target.href);
        } else {
          document.getElementById('error').textContent = 'This link is not valid.';
        }
      } catch {
        document.getElementById('error').textContent = 'This link is not valid.';
      }
    }
  </script>
</body>
</html>
